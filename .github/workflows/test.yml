name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The tests load the extension with the globally installed Pi's own dependencies (jiti, typebox).
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npm test
