name: Optional end-to-end checks

# Deliberately outside build/deploy gates; run selected checks locally first.
on:
  workflow_dispatch:

jobs:
  test:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The tests load the extension with the globally installed Pi's own dependencies (jiti, typebox).
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npm test
